<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suchergebnisse - Bibliothek Stein AR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="search">
    <header class="site-header shell">
      <a class="brand" href="index.html">Bibliothek Stein AR</a>
      <nav class="nav">
        <a href="catalog.html">Katalog</a>
        <a href="new.html">Neuheiten</a>
        <a href="contributions.html">Buch melden</a>
      </nav>
    </header>

    <main class="shell catalog-layout">
      <aside class="filter-panel reveal">
        <h1>Suche</h1>

        <label for="q">Suchbegriff</label>
        <input id="q" name="q" type="search" placeholder="Titel, Autor, ISBN..." />

        <label for="type">Typ</label>
        <select id="type" name="type">
          <option value="">Alle Typen</option>
          <option value="Buch">Bücher</option>
          <option value="CD">CDs</option>
          <option value="Zeitschrift">Zeitschriften</option>
          <option value="Spiel">Spiele/Kartenspiele</option>
        </select>

        <label for="genre">Genre/Rubrik</label>
        <select id="genre" name="genre">
          <option value="">Alle Genres</option>
        </select>

        <label for="owner">Besitzer</label>
        <select id="owner" name="owner">
          <option value="">Alle</option>
        </select>

        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="">Alle</option>
          <option value="Keine ISBN ermittelt">Keine ISBN ermittelt</option>
          <option value="OK">OK</option>
        </select>

        <label class="check">
          <input id="isNew" name="isNew" type="checkbox" />
          Neu hinzugefügt
        </label>
      </aside>

      <section class="catalog-content reveal" style="--delay: 120ms">
        <div class="result-head">
          <h2>Suchergebnisse</h2>
          <p id="resultCount">Lade Daten...</p>
        </div>
        <div id="results" class="card-grid"></div>
      </section>
    </main>

    <footer class="site-footer shell">
      <p>Bibliothek Stein AR · Öffentlicher Online-Katalog</p>
    </footer>

    <script src="assets/site.js" defer></script>
    <script src="assets/catalog.js" defer></script>
  </body>
</html>
