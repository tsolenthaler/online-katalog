<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online-Katalog Start | Bibliothek Stein AR</title>
    <meta
      name="description"
      content="Schneller Einstieg in den Online-Katalog der Bibliothek Stein AR."
    />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="hero">
      <p class="hero__kicker">Bibliothek Stein AR</p>
      <h1>Online-Katalog</h1>
      <p class="hero__lead">
        Durchsuche den Bestand nach Titel, Autor oder Rubrik und entdecke Bücher mit Cover und Kurzinfos.
      </p>
    </header>

    <main class="layout layout--landing">
      <section class="panel panel--filters" aria-label="Katalogsuche starten">
        <div class="panel__head">
          <h2>Suche starten</h2>
        </div>

        <form id="startSearchForm" action="search.html" method="get" class="landing-search">
          <label for="searchInput">Suchbegriff</label>
          <input
            id="searchInput"
            name="q"
            type="search"
            placeholder="Titel, Autor, Genre oder ISBN"
            autocomplete="off"
          />
          <button type="submit" class="ghost-btn landing-search__submit">Im Katalog suchen</button>
        </form>

        <p class="share-status">Ergebnisse werden erst auf der Suchseite geladen.</p>
      </section>

      <section class="panel" aria-label="Katalogstatistik">
        <div class="panel__head">
          <h2>Statistik</h2>
        </div>
        <div class="stats" aria-live="polite">
          <article class="stat-card">
            <span class="stat-card__label">Bücher</span>
            <strong id="landingBookCount">-</strong>
          </article>
          <article class="stat-card">
            <span class="stat-card__label">Autoren</span>
            <strong id="landingAuthorCount">-</strong>
          </article>
          <article class="stat-card">
            <span class="stat-card__label">Genres</span>
            <strong id="landingGenreCount">-</strong>
          </article>
        </div>
      </section>

      <section class="panel panel--charts" aria-label="Top Listen">
        <div>
          <h3>Top Autoren</h3>
          <ol id="landingTopAuthors" class="rank-list"></ol>
        </div>
        <div>
          <h3>Top Genres</h3>
          <ol id="landingTopGenres" class="rank-list"></ol>
        </div>
      </section>
    </main>

    <script src="assets/landing-stats.js" defer></script>
  </body>
</html>
